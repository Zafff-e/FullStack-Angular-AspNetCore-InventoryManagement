<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to access Inventory System</p>
          </div>

          @if (errorMessage) {
            <div class="alert alert-danger py-2 small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMessage }}
            </div>
          }

          <form (ngSubmit)="onLogin()">
            <div class="mb-3">
              <label for="username" class="form-label fw-medium">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" id="username" name="username" class="form-control bg-light border-start-0"
                       [(ngModel)]="loginData.username" placeholder="Enter username" required />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-medium">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" id="password" name="password" class="form-control bg-light border-start-0"
                       [(ngModel)]="loginData.password" placeholder="Enter password" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold" [disabled]="isLoading">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span> Logging in...
              } @else {
                <i class="bi bi-box-arrow-in-right me-1"></i> Log In
              }
            </button>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">Don't have an account? <a routerLink="/register" class="fw-semibold text-primary text-decoration-none">Register here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
