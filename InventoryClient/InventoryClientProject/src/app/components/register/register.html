<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex p-3 mb-2">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Create an Account</h3>
            <p class="text-muted small">Register to manage your Inventory</p>
          </div>

          @if (errorMessage) {
            <div class="alert alert-danger py-2 small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMessage }}
            </div>
          }
          @if (successMessage) {
            <div class="alert alert-success py-2 small" role="alert">
              <i class="bi bi-check-circle-fill me-1"></i> {{ successMessage }}
            </div>
          }

          <form (ngSubmit)="onRegister()">
            <div class="mb-3">
              <label for="fullName" class="form-label fw-medium">Full Name</label>
              <input type="text" id="fullName" name="fullName" class="form-control bg-light"
                     [(ngModel)]="registerData.fullName" placeholder="John Doe" />
            </div>

            <div class="mb-3">
              <label for="username" class="form-label fw-medium">Username *</label>
              <input type="text" id="username" name="username" class="form-control bg-light"
                     [(ngModel)]="registerData.username" placeholder="johndoe" required />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-medium">Email Address *</label>
              <input type="email" id="email" name="email" class="form-control bg-light"
                     [(ngModel)]="registerData.email" placeholder="john@example.com" required />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-medium">Password *</label>
              <input type="password" id="password" name="password" class="form-control bg-light"
                     [(ngModel)]="registerData.password" placeholder="At least 6 characters" required />
            </div>

            <div class="mb-4">
              <label for="role" class="form-label fw-medium">Role</label>
              <select id="role" name="role" class="form-select bg-light" [(ngModel)]="registerData.role">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
              </select>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-semibold" [disabled]="isLoading">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span> Registering...
              } @else {
                <i class="bi bi-check-lg me-1"></i> Register Account
              }
            </button>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">Already have an account? <a routerLink="/login" class="fw-semibold text-success text-decoration-none">Log in here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
